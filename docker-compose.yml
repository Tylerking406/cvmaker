services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cvmaker
      POSTGRES_USER: cvmaker
      POSTGRES_PASSWORD: cvmaker_local
    ports:
      - "5433:5432"
    volumes:
      # No initdb schema mount: EF migrations create the schema on API start. Mounting a
      # schema here as well would make initdb create the tables first, and the API's
      # Migrate() would then die on "relation already exists".
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvmaker -d cvmaker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── .NET 8 API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./CvMaker.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=cvmaker;Username=cvmaker;Password=cvmaker_local
      CORS_ORIGIN: http://localhost:3000
      # HS256 signing key. The API refuses to start if this is missing or under 32 bytes.
      # Override in CI/prod by exporting SUPABASE_JWT_SECRET; when pointing at a real
      # Supabase project, use that project's JWT secret and issuer here.
      Supabase__JwtSecret: ${SUPABASE_JWT_SECRET:-local-dev-only-secret-change-me-32chars-min}
      Supabase__Issuer: http://localhost:5133/auth/v1
      # Dev fixture account (arinao.dev@gmail.com). Requires Development as well; the API
      # refuses to seed on either signal alone.
      Seed__Enabled: "true"
    ports:
      - "5133:5133"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5133/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ─── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./cvmaker-ui
      dockerfile: Dockerfile
      args:
        # Points the fallback rewrite proxy at the API container. The mock app/api/
        # handlers have been removed, so every /api/* request — including auth — is
        # proxied to the .NET API. Baked in at build time for next.config.ts.
        BACKEND_URL: http://api:5133
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:5133
    ports:
      - "3000:3000"

volumes:
  postgres_data:
